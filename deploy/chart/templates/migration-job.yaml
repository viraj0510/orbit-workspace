apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orbit.fullname" . }}-migrate
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbit-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ required "image.repository is set by the deployment workflow" .Values.image.repository }}:{{ required "image.tag is set by the deployment workflow" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/postgresql/schema.prisma"]
          env:
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: orbit-runtime
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
