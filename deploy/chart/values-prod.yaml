replicaCount: 2

image:
  repository: ""
  tag: bootstrap
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  albSecurityGroupId: ""

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

podDisruptionBudget:
  minAvailable: 1
