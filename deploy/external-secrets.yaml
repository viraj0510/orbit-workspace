apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: orbit-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orbit-runtime
  namespace: orbit
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orbit-aws-secrets
    kind: ClusterSecretStore
  target:
    name: orbit-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: ${APP_RUNTIME_SECRET_ARN}
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: ${APP_RUNTIME_SECRET_ARN}
        property: JWT_SECRET
    - secretKey: APP_ORIGIN
      remoteRef:
        key: ${APP_RUNTIME_SECRET_ARN}
        property: APP_ORIGIN
    - secretKey: ORIGIN_VERIFY_TOKEN
      remoteRef:
        key: ${APP_RUNTIME_SECRET_ARN}
        property: ORIGIN_VERIFY_TOKEN
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: ${APP_RUNTIME_SECRET_ARN}
        property: GOOGLE_CLIENT_ID
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orbit-grafana-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orbit-aws-secrets
    kind: ClusterSecretStore
  target:
    name: orbit-grafana-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: ${GRAFANA_SECRET_ARN}
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: ${GRAFANA_SECRET_ARN}
        property: admin-password
