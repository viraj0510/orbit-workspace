name: Build, scan, and deploy EC2 demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "Dockerfile.ec2"
      - "infra/ec2-demo/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: orbit-ec2-demo-deploy
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deploy variables
        run: |
          test -n "$AWS_REGION" || { echo "Set repository variable AWS_REGION"; exit 1; }
          test -n "$AWS_ROLE_TO_ASSUME" || { echo "Set repository variable AWS_ROLE_TO_ASSUME"; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "Set repository variable EC2_INSTANCE_ID"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Set repository variable ECR_REPOSITORY"; exit 1; }

      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: publish
        env:
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          IMAGE_TAG="${ECR_REPOSITORY}:sha-${GITHUB_SHA}"
          docker buildx build \
            --file Dockerfile.ec2 \
            --build-arg "VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}" \
            --tag "$IMAGE_TAG" \
            --push \
            .
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.publish.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Deploy through Systems Manager
        env:
          IMAGE_TAG: ${{ steps.publish.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          image = os.environ["IMAGE_TAG"]
          script = "set -euo pipefail\n"
          script += "printf '%s\\n' " + json.dumps(image) + " | tee /etc/orbit/image-uri\n"
          script += "systemctl reset-failed orbit-deploy.service || true\n"
          script += "systemctl restart orbit-deploy.service\n"
          pathlib.Path("/tmp/orbit-ssm-command.json").write_text(json.dumps({
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [os.environ["EC2_INSTANCE_ID"]],
              "Comment": "Deploy Orbit image " + os.environ["GITHUB_SHA"],
              "Parameters": {"commands": [script]},
          }))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/orbit-ssm-command.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for Systems Manager deployment command $COMMAND_ID" >&2
          exit 1
